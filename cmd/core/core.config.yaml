# Bootstrap settings only. Agents, missions, layouts and agent↔layout
# transforms now live in PocketBase collections (agents, missions, layouts,
# agent_layouts) and are edited via the admin UI at http://127.0.0.1:8090/_/.
# Core loads them at startup and live-reloads on every create/update/delete.
# On first boot each empty collection is seeded with the previous dev fixtures.

grpc_listen_addr: ":9090"
grpc_advertise_addr: "localhost:9090"

pocketbase:
  enabled: true
  listen_addr: "127.0.0.1:8090"
  data_dir: "pb_data"

# Core's own connection to the mqtt broker agents publish telemetry to (see
# pkg/agentsdk, cmd/core/telemetry/ingest). Off by default -- disabled, core
# runs exactly as it did before this feature existed. topic_prefix must match
# what agents are configured to publish under.
mqtt:
  enabled: false
  broker: "tcp://127.0.0.1:1883"
  client_id: "vantageos-core"
  username: ""
  password: ""
  topic_prefix: "vantageos"
