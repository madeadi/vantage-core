syntax = "proto3";

package agent.v1;

import "google/protobuf/timestamp.proto";

option go_package = "vantageos-core/proto/agentsdk/v1;agentv1";

// AgentService is the gRPC contract between core and agents. Task dispatch
// and telemetry ingest moved to MQTT (specs/mqtt_telemetry.specs.md Steps
// 16-17, StreamTasks/ReportTelemetry removed); pose streaming and the two
// RPCs below stay gRPC until Step 17's "pose and missions move" follow-up.
service AgentService {
    // Agent streams the pose telemetry up to core
    rpc ReportPoseTelemetry(stream PoseTelemetryEvent) returns (PoseTelemetryAck);

    // Agent get the affine transformation matrix from core
    rpc GetTransformationMatrices(TransformationMatrixRequest) returns (TransformationMatrixResponse);
    // agents send skills to core, so that core can know what skills the agent has
    rpc ReportSkills(SkillRegistration) returns (SkillRegistrationAck);
}

// TaskAck's shape is still shared by both a StreamTasks-era gRPC caller (now
// removed) and the MQTT path (cmd/core/task_mqtt.go's taskStatusHandler
// decodes agentsdk.TaskStatusPayload off the wire and builds one of these),
// so both transports' status updates converge on the same
// TaskUpdatedHandler.OnTaskUpdated code path.
message TaskAck {
    string task_id = 1;
    TaskStatus status = 2; // robot sends: CANNOT_START, STARTED, ABORTED, FAILED, FINISHED
    string error_message = 3; // populated on FAILED
    bytes result = 4; // opaque result payload, populated on FINISHED
}

message Task {
    string id      = 1;
    string type    = 2; // e.g. "GO_TO", "GO_HOME"
    bytes  payload = 3; // opaque task payload (matches current Task.Payload)
    // if the task is not executed within this time, it will be expired
    google.protobuf.Timestamp to_expire_at   = 4;
    // if the task is not completed within this time, it will be finalised
    google.protobuf.Timestamp to_finalise_at = 5;

    // The agent context contains information that can be used
    // by agent to pass message to other agents.
    // Please use with care, because it is not guaranteed to be available.
    AgentContext agent_context = 6;
}

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_DRAFT       = 1;
  TASK_STATUS_STARTING    = 2;
  TASK_STATUS_CANNOT_START = 3;
  TASK_STATUS_STARTED     = 4;
  TASK_STATUS_EXPIRING    = 5;
  TASK_STATUS_EXPIRED     = 6;
  TASK_STATUS_ABORTING    = 7;
  TASK_STATUS_ABORTED     = 8;
  TASK_STATUS_FAILED      = 9;
  TASK_STATUS_FINISHING   = 10;
  TASK_STATUS_FINISHED    = 11;
}

message AgentContext {
    string mission_id = 1;
    string mission_context = 2;
    bytes context = 3;
}

// Pose Telemetry
message PoseTelemetryEvent {
    string agent_id = 1;
    string layout_id = 2;
    double x = 3;
    double y = 4;
    double yaw = 5;
    google.protobuf.Timestamp timestamp = 6;
}

message PoseTelemetryAck {}

// Heartbeat
message HeartbeatEvent {
    google.protobuf.Timestamp sent_at = 1;
}
message HeartbeatAck {
    google.protobuf.Timestamp sent_at = 1;
}

// Transformation Matrix
message TransformationMatrixRequest {
  string agent_id = 1;
}

message TransformationMatrixResponse {
  repeated TransformationMatrix matrices = 1;
}

message TransformationMatrix {
  string layout_id = 1;
  repeated double matrix = 2; // 3x3 affine transformation matrix in row-major order (exactly 9 values)
  double north_offset = 3;    // clockwise rotation in radians from robot north to layout north
}

// skill registration
message Skill {
  string type = 1; // e.g. "tech.taksu.GO_TO", "tech.taksu.GO_HOME"
  string description = 2; // human-readable description of the skill
  string payload_schema = 3; // JSON schema for the skill payload
}

message SkillRegistration {
  repeated Skill skills = 1;
}

message SkillRegistrationAck {

}